{% assign share_url = page.url | absolute_url %}
{% capture share_text %}{% if page.layout == "post" %}{{ page.title }} (AI Engineering, week {{ page.week }}){% else %}AI Engineering: a weekly build log by Tosin Owobo{% endif %}{% endcapture %}
<div class="share" data-url="{{ share_url }}" data-title="{{ share_text | strip | escape }}">
  <button type="button" class="btn small share-btn" aria-label="Share this page">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>
    <span class="share-label">Share</span>
  </button>
  <a class="btn small" href="https://www.linkedin.com/sharing/share-offsite/?url={{ share_url | url_encode }}" target="_blank" rel="noopener">LinkedIn</a>
  <a class="btn small" href="https://x.com/intent/post?url={{ share_url | url_encode }}&text={{ share_text | strip | url_encode }}" target="_blank" rel="noopener">X</a>
  <span class="share-status" role="status" aria-live="polite"></span>
</div>
